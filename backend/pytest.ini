[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Cobertura desactivada por defecto — usa: pytest --cov=app --cov-report=html para activar
# El umbral mínimo actual es 30% (fase de desarrollo); incrementar conforme crece la suite
# tests/manual holds runnable scripts that hit a live server and toggle Windows
# services. Run them by hand. norecursedirs matches by directory name during the
# walk, so it holds no matter which directory pytest is invoked from; --ignore is
# resolved against the invocation dir and silently misses when run from the repo root.
norecursedirs = manual scratch venv venv_win .venv
addopts = -v --tb=short --ignore=tests/manual --ignore=scratch
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Marcadores personalizados para filtrar tests por categoría
markers =
    unit: Tests unitarios (rápidos, sin dependencias externas)
    integration: Tests de integración contra la API HTTP
    slow: Tests que toman más de 2 segundos
    critical: Tests de funcionalidad crítica para producción
    rbac: Tests de control de acceso (roles y permisos)
    e2e: Tests end-to-end (Playwright)
