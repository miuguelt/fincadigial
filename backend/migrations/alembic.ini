# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = .

# Solo la cadena activa. `versions/legacy` contiene las 33 revisiones
# históricas archivadas en el squash (con IDs duplicados de la cadena actual);
# desde Alembic 1.6 los subdirectorios se escanean por defecto y eso rompe la
# resolución. Al fijar version_locations, el escaneo se limita a `versions`.
version_locations = %(here)s/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
