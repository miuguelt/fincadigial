[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = manual
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Tests unitarios (rápidos, sin dependencias externas)
    integration: Tests de integración contra la API HTTP
    slow: Tests que toman más de 2 segundos
    critical: Tests de funcionalidad crítica para producción
    rbac: Tests de control de acceso (roles y permisos)
    e2e: Tests end-to-end (Playwright)
