# Mapeo para preservar X-Forwarded-Proto enviado por Coolify/Traefik
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Permitir subida de fotos e importaciones masivas (hasta 16MB)
    client_max_body_size 16M;

    # ── Seguridad ─────────────────────────────────────────────────────
    # En producción Coolify + Traefik manejan HTTPS/HSTS externamente.
    # Estos headers aplican a nivel de aplicación.
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(self), geolocation=(self), microphone=()" always;

    # CSP – ajustar dominios según integraciones reales
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self';
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
         font-src 'self' https://fonts.gstatic.com;
         img-src 'self' data: blob: https:;
         connect-src 'self' wss: https:;
         worker-src 'self' blob:;
         manifest-src 'self';"
        always;

    # ── Compresión ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # ── Proxy al Backend (API) ─────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://villaluz-backend:8081/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           "";
        proxy_set_header Connection        "";

        # Timeouts para operaciones lentas (generación de PDF, reportes)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Desactivar cache de Nginx para API operativa en tiempo real
        proxy_cache               off;

        # Buffers
        proxy_buffering           on;
        proxy_buffer_size         4k;
        proxy_buffers             8 16k;
        proxy_busy_buffers_size   32k;
    }

    # ── SSE (Server-Sent Events) — sin buffering ───────────────────────
    location /api/v1/sse/ {
        proxy_pass http://villaluz-backend:8081/api/v1/sse/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_read_timeout                 3600s;
        chunked_transfer_encoding          on;
    }

    # ── Proxy de Archivos Estáticos / Uploads ───────────────────────────
    location /static/uploads/ {
        proxy_pass http://villaluz-backend:8081/static/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache off;
        expires off;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Vary "Cookie, Authorization" always;
    }

    # ── Service Worker — sin caché (crítico para PWA) ──────────────────
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    location = /sw.mjs {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # ── Manifest PWA ───────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
    }

    # The HTML shell must revalidate so a new deployment is picked up quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ── Assets con hash de versión (inmutables si existen) ─────────────
    # Si un cliente con HTML viejo solicita un chunk ya inexistente tras un nuevo
    # deploy, en vez de romper con 404 Nginx responde con un fallback que purga
    # cachés/SW y recarga la aplicación limpiamente.
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @fallback_css;
    }

    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @fallback_js;
    }

    location @fallback_css {
        default_type text/css;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 "/* Obsolete CSS chunk fallback - trigger clean reload */\n";
    }

    location @fallback_js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 "console.warn('[Villaluz] Chunk obsoleto detectado tras nuevo despliegue. Purgando cache...');if('caches' in window){caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c);}));}).then(function(){if('serviceWorker' in navigator){return navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(s){return s.unregister();}));});}}).finally(function(){window.location.reload(true);});}else{window.location.reload(true);}\n";
    }

    # ── Imágenes y fuentes ─────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── SPA Fallback (React Router) ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ── Páginas de error ───────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Ocultar versión de Nginx ───────────────────────────────────────
    server_tokens off;
}
