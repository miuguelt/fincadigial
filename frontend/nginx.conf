server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ── Seguridad ─────────────────────────────────────────────────────
    # En producción Coolify + Traefik manejan HTTPS/HSTS externamente.
    # Estos headers aplican a nivel de aplicación.
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # CSP – ajustar dominios según integraciones reales
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self' 'unsafe-inline' 'unsafe-eval';
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
         font-src 'self' https://fonts.gstatic.com;
         img-src 'self' data: blob: https:;
         connect-src 'self' wss: https:;
         worker-src 'self' blob:;
         manifest-src 'self';"
        always;

    # ── Compresión ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # ── Proxy al Backend ───────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://villaluz-backend:8081/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Keep ordinary API requests on reusable HTTP/1.1 connections. Upgrade
        # is reserved for the dedicated realtime transports below.
        proxy_set_header Upgrade           "";
        proxy_set_header Connection        "";

        # Timeouts para operaciones lentas (generación de PDF, seeding)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffers (evita que Nginx bufferee respuestas grandes en disco)
        proxy_buffering           on;
        proxy_buffer_size         4k;
        proxy_buffers             8 16k;
        proxy_busy_buffers_size   32k;
    }

    # ── SSE (Server-Sent Events) — sin buffering ───────────────────────
    location /api/v1/sse/ {
        proxy_pass http://villaluz-backend:8081/api/v1/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection  "";
        proxy_set_header Host        $host;
        proxy_buffering              off;
        proxy_cache                  off;
        proxy_read_timeout           3600s;
        chunked_transfer_encoding    on;
    }

    # ── Service Worker — sin caché (crítico para PWA) ──────────────────
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    location = /sw.mjs {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # ── Manifest PWA ───────────────────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
    }

    # The HTML shell must revalidate so a new deployment is picked up quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ── Assets con hash de versión (inmutables) ────────────────────────
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Imágenes y fuentes ─────────────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── SPA Fallback (React Router) ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Páginas de error ───────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Ocultar versión de Nginx ───────────────────────────────────────
    server_tokens off;
}
