# ════════════════════════════════════════════════════════════════════════
# FINCA VILLA LUZ — Docker Compose Oficial (Producción Coolify v4)
# ════════════════════════════════════════════════════════════════════════
#
# Arquitectura de 2 Contenedores:
#   1. villaluz-frontend  → Nginx 1.27 Alpine (React SPA + Reverse Proxy en puerto 80)
#   2. villaluz-backend   → Flask + Gunicorn / Gevent (puerto interno 8081)
#                           * Incluye entrypoint automático: espera a PostgreSQL,
#                             aplica migraciones (flask db upgrade) e inicializa
#                             catálogos base colombianos y el admin único.
#
# Red:
#   * Sin redes custom. Coolify gestiona automáticamente la
#     red bridge donde Traefik y los servicios se comunican sin colisiones.
#
# Volúmenes Persistentes (Cero pérdida de datos en redeploys):
#   * uploads_data      → Fotos de animales, documentos, marcas y certificados ICA
#   * maintenance_logs  → Auditorías, trazabilidad ganadera y diagnósticos
#   * app_logs          → Registros de eventos y seguridad de la aplicación
#   * backups_data      → Respaldos locales de base de datos
# ════════════════════════════════════════════════════════════════════════

services:

  # ── 1. FRONTEND (Nginx 1.27 + React SPA + Reverse Proxy) ──────────────
  villaluz-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RUNTIME_ENV: production
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://${DOMAIN}}
        VITE_USE_BEARER_AUTH: "true"
    image: villaluz-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    expose:
      - '80'
    depends_on:
      villaluz-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || curl -fsS http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      coolify.managed: "true"
      coolify.port: "80"

  # ── 2. BACKEND (Flask + Gunicorn + Migraciones Integradas) ─────────────
  villaluz-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: villaluz-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: >
      gunicorn
      --preload
      --worker-class gevent
      --workers ${GUNICORN_WORKERS:-2}
      --worker-connections ${GUNICORN_CONNECTIONS:-200}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --graceful-timeout 30
      --max-requests 1000
      --max-requests-jitter 100
      --bind 0.0.0.0:8081
      --access-logfile -
      --error-logfile -
      wsgi:app
    expose:
      - "8081"
    environment:
      # ── 🔴 VARIABLES PRINCIPALES REQUERIDAS ──
      DOMAIN: ${DOMAIN}
      DATABASE_URL: ${DATABASE_URL:-}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      VILLALUZ_ADMIN_EMAIL: ${VILLALUZ_ADMIN_EMAIL}
      VILLALUZ_ADMIN_PASSWORD: ${VILLALUZ_ADMIN_PASSWORD}

      # ── Base de Datos Alternativa (si no defines DATABASE_URL) ──
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-villaluz}
      DB_ENGINE: ${DB_ENGINE:-postgresql+psycopg2}
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}

      # ── Secretos y Tokens (Heredan de FLASK_SECRET_KEY automáticamente) ──
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${FLASK_SECRET_KEY}}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-${DOMAIN}}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      JWT_COOKIE_CSRF_PROTECT: ${JWT_COOKIE_CSRF_PROTECT:-true}

      # ── CORS y URLs (Derivadas automáticamente de DOMAIN) ──
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN},https://www.${DOMAIN}}
      API_BASE_URL: ${API_BASE_URL:-https://${DOMAIN}/api/v1}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
      BACKEND_URL: ${BACKEND_URL:-https://${DOMAIN}}
      PREFERRED_URL_SCHEME: https
      FLASK_ENV: production
      FLASK_APP: wsgi.py

      # ── Bootstrap Administrador Único y Finca (Con defaults colombianos) ──
      VILLALUZ_BOOTSTRAP_ENABLED: ${VILLALUZ_BOOTSTRAP_ENABLED:-true}
      VILLALUZ_BOOTSTRAP_ON_PRODUCTION: ${VILLALUZ_BOOTSTRAP_ON_PRODUCTION:-true}
      VILLALUZ_ADMIN_IDENTIFICATION: ${VILLALUZ_ADMIN_IDENTIFICATION:-1000000001}
      VILLALUZ_ADMIN_FULLNAME: ${VILLALUZ_ADMIN_FULLNAME:-Administrador Principal}
      VILLALUZ_ADMIN_PHONE: ${VILLALUZ_ADMIN_PHONE:-3000000000}
      VILLALUZ_ADMIN_FARM_NAME: ${VILLALUZ_ADMIN_FARM_NAME:-Finca Villa Luz}
      VILLALUZ_ADMIN_FARM_TYPE: ${VILLALUZ_ADMIN_FARM_TYPE:-Tradicional}
      VILLALUZ_ADMIN_FARM_DEPARTMENT: ${VILLALUZ_ADMIN_FARM_DEPARTMENT:-Cundinamarca}
      VILLALUZ_ADMIN_FARM_MUNICIPALITY: ${VILLALUZ_ADMIN_FARM_MUNICIPALITY:-Bogotá}

      # ── Estricto: Cero datos demo en producción ──
      VILLALUZ_SEED_DEMO_DATA: "false"

      # ── Redis / Caché / Celery (Opcional en Red Coolify) ──
      REDIS_URL: ${REDIS_URL:-}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-${REDIS_URL:-}}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL:-}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL:-}}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-${REDIS_URL:-}}

      # ── Notificaciones Email (SMTP - Opcional) ──
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Finca Villa Luz}

      # ── Monitoreo Sentry (Opcional) ──
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads_data:/app/static/uploads
      - maintenance_logs:/app/maintenance
      - app_logs:/app/logs
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# ── VOLÚMENES PERSISTENTES (Cero pérdida de datos en redeploys) ────────
volumes:
  uploads_data:
    driver: local
  maintenance_logs:
    driver: local
  app_logs:
    driver: local
  backups_data:
    driver: local
