# ════════════════════════════════════════════════════════════════════════
# FINCA VILLA LUZ — Docker Compose Oficial (Producción Coolify v4)
# ════════════════════════════════════════════════════════════════════════
#
# Arquitectura de 2 Contenedores:
#   1. villaluz-frontend  → Nginx 1.27 Alpine (React SPA + Reverse Proxy en puerto 80)
#   2. villaluz-backend   → Flask + Gunicorn / Gevent (puerto interno 8081)
#                           * Incluye entrypoint automático: espera a PostgreSQL,
#                             aplica migraciones (flask db upgrade) e inicializa
#                             catálogos base colombianos y el admin único.
#
# Red:
#   * Sin redes custom. Coolify gestiona automáticamente la
#     red bridge donde Traefik y los servicios se comunican sin colisiones.
#
# Volúmenes Persistentes (Cero pérdida de datos en redeploys):
#   * uploads_data      → Fotos de animales, documentos, marcas y certificados ICA
#   * maintenance_logs  → Auditorías, trazabilidad ganadera y diagnósticos
#   * app_logs          → Registros de eventos y seguridad de la aplicación
#   * backups_data      → Respaldos locales de base de datos
# ════════════════════════════════════════════════════════════════════════

services:

  # ── 1. FRONTEND (Nginx 1.27 + React SPA + Reverse Proxy) ──────────────
  villaluz-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RUNTIME_ENV: production
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://${DOMAIN}}
        VITE_USE_BEARER_AUTH: "true"
    image: villaluz-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    expose:
      - '80'
    depends_on:
      villaluz-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || curl -fsS http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      coolify.managed: "true"
      coolify.port: "80"

  # ── 2. BACKEND (Flask + Gunicorn + Migraciones Integradas) ─────────────
  villaluz-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: villaluz-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: >
      gunicorn
      --preload
      --worker-class gevent
      --workers ${GUNICORN_WORKERS:-2}
      --worker-connections ${GUNICORN_CONNECTIONS:-200}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --graceful-timeout 30
      --max-requests 1000
      --max-requests-jitter 100
      --bind 0.0.0.0:8081
      --access-logfile -
      --error-logfile -
      wsgi:app
    expose:
      - "8081"
    environment:
      # ── 🔴 5 VARIABLES OBLIGATORIAS (Configurar en Coolify) ──
      DOMAIN: ${DOMAIN}
      # Conexión PostgreSQL (formato: postgresql://user:password@host:5432/villaluz)
      DATABASE_URL: ${DATABASE_URL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      VILLALUZ_ADMIN_EMAIL: ${VILLALUZ_ADMIN_EMAIL}
      VILLALUZ_ADMIN_PASSWORD: ${VILLALUZ_ADMIN_PASSWORD}

      # ── Secretos y Tokens (Heredan de FLASK_SECRET_KEY automáticamente) ──
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${FLASK_SECRET_KEY}}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-${DOMAIN}}

      # ── CORS y URLs (Derivadas automáticamente de DOMAIN) ──
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN},https://www.${DOMAIN}}
      API_BASE_URL: ${API_BASE_URL:-https://${DOMAIN}/api/v1}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
      PREFERRED_URL_SCHEME: https
      FLASK_ENV: production
      FLASK_APP: wsgi.py

      # ── Estricto: Cero datos demo en producción ──
      VILLALUZ_SEED_DEMO_DATA: ${VILLALUZ_SEED_DEMO_DATA:-false}

      # ── Redis / Caché / Celery (Opcional en Red Coolify - Solo URL) ──
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - uploads_data:/app/static/uploads
      - maintenance_logs:/app/maintenance
      - app_logs:/app/logs
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# ── VOLÚMENES PERSISTENTES (Cero pérdida de datos en redeploys) ────────
volumes:
  uploads_data:
    driver: local
  maintenance_logs:
    driver: local
  app_logs:
    driver: local
  backups_data:
    driver: local
