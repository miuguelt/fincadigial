<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión — Finca Villa Luz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #f1f5f9;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      max-width: 420px; width: 100%; margin: 1rem;
    }
    .icon-wrap {
      width: 80px; height: 80px;
      background: #fef3c7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrap svg { width: 40px; height: 40px; color: #d97706; }
    h1 { font-size: 1.75rem; font-weight: 800; text-align: center; margin-bottom: .5rem; }
    .subtitle { color: #94a3b8; text-align: center; line-height: 1.6; margin-bottom: 1.5rem; font-size: .95rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .4rem 1rem; background: #422006; color: #fcd34d;
      border-radius: 9999px; font-size: .8rem; font-weight: 600;
      margin: 0 auto 1.5rem; display: flex; width: fit-content; margin: 0 auto 1.5rem;
    }
    .dot { width: 8px; height: 8px; background: #f59e0b; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .actions { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1.5rem; }
    button {
      padding: .8rem 1.25rem; border: none; border-radius: .75rem;
      font-size: .95rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .section { border-top: 1px solid #334155; padding-top: 1.25rem; }
    .section-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: #64748b; margin-bottom: .75rem; font-weight: 700; }
    .data-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem .8rem; background: #0f172a; border-radius: .5rem;
      margin-bottom: .4rem; font-size: .85rem;
    }
    .pill { padding: .2rem .6rem; border-radius: 9999px; font-size: .7rem; font-weight: 700; }
    .pill-green { background: #064e3b; color: #6ee7b7; }
    .pill-amber { background: #422006; color: #fcd34d; }
    .pill-red { background: #450a0a; color: #fca5a5; }
    .pending-count {
      text-align: center; padding: .75rem;
      background: #422006; border-radius: .75rem; margin-top: .5rem;
      font-size: .9rem; color: #fcd34d; font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M12 12h.01M8.464 15.536a5 5 0 01-7.072-7.072M5.636 5.636A9 9 0 015.636 18.364" />
      </svg>
    </div>

    <h1>Modo Campo</h1>
    <p class="subtitle">Sin conexión a internet. Tus datos están guardados localmente y se sincronizarán automáticamente cuando recuperes señal.</p>

    <div class="badge">
      <span class="dot"></span>
      <span>Sin Conexión — Modo Offline</span>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="tryReconnect()">Intentar Reconectar</button>
      <button class="btn-secondary" onclick="window.location.href='/'">Ir al Inicio</button>
    </div>

    <div class="section" id="pendingSection" style="display:none">
      <div class="section-title">Operaciones Pendientes de Sync</div>
      <div id="pendingContent"></div>
    </div>

    <div class="section" id="cacheSection" style="display:none; margin-top: 1rem;">
      <div class="section-title">Datos Disponibles Offline</div>
      <div id="cacheList"></div>
    </div>
  </div>

  <script>
    // Reconectar
    function tryReconnect() {
      if (navigator.onLine) { window.location.reload(); }
      else { alert('Aún sin señal. Verifica tu red.'); }
    }
    window.addEventListener('online', () => window.location.reload());

    // Leer pendientes de IndexedDB (VillaLuzQueue)
    async function loadPending() {
      try {
        const db = await new Promise((res, rej) => {
          const req = indexedDB.open('VillaLuzQueue', 1);
          req.onerror = () => rej(req.error);
          req.onsuccess = () => res(req.result);
        });
        const ops = await new Promise((res, rej) => {
          const tx = db.transaction('offlineQueue', 'readonly');
          const r = tx.objectStore('offlineQueue').getAll();
          r.onerror = () => rej(r.error);
          r.onsuccess = () => res(r.result);
        });
        const pending = ops.filter(o => o.status !== 'completed');
        if (pending.length > 0) {
          const section = document.getElementById('pendingSection');
          const content = document.getElementById('pendingContent');
          section.style.display = 'block';
          pending.slice(0, 5).forEach(op => {
            const div = document.createElement('div');
            div.className = 'data-item';
            const url = op.url.split('/api/v1/').pop() || op.url;
            const pillClass = op.status === 'failed' ? 'pill-red' : 'pill-amber';
            const pillText = op.status === 'failed' ? 'Error' : 'Pendiente';
            div.innerHTML = `<span>${op.method} /${url.split('/')[0]}</span><span class="pill ${pillClass}">${pillText}</span>`;
            content.appendChild(div);
          });
          if (pending.length > 5) {
            const more = document.createElement('div');
            more.className = 'pending-count';
            more.textContent = `+${pending.length - 5} operaciones más guardadas`;
            content.appendChild(more);
          }
        }
      } catch (e) { /* IndexedDB no disponible */ }
    }

    // Mostrar datos en caché del SW
    async function loadCache() {
      try {
        const cacheNames = ['field-data-cache', 'master-data-cache'];
        const allKeys = [];
        for (const name of cacheNames) {
          try {
            const cache = await caches.open(name);
            const keys = await cache.keys();
            keys.forEach(k => allKeys.push({ url: k.url, cache: name }));
          } catch {}
        }
        if (allKeys.length > 0) {
          const section = document.getElementById('cacheSection');
          const list = document.getElementById('cacheList');
          section.style.display = 'block';
          const shown = new Set();
          allKeys.slice(0, 6).forEach(({ url }) => {
            const parts = url.split('/api/v1/');
            const endpoint = parts.length > 1 ? parts[1].split('?')[0] : url.split('/').pop();
            const label = endpoint.split('/')[0] || endpoint;
            if (shown.has(label)) return;
            shown.add(label);
            const div = document.createElement('div');
            div.className = 'data-item';
            div.innerHTML = `<span>/${label}</span><span class="pill pill-green">En caché</span>`;
            list.appendChild(div);
          });
        }
      } catch {}
    }

    loadPending();
    loadCache();
  </script>
</body>
</html>
