project: villaluz
status: active
updated: 2026-08-15
purpose: >-
  Plataforma web para la gestión operativa y pedagógica de la finca Villa Luz.

canonical_roots:
  backend: backend/
  frontend: frontend/
  docs: docs/
  scripts: scripts/
  maintenance: maintenance/
  tests: tests/
  local_archive: _archive/cleanup-2026-08-15/

runtime:
  launcher: start-windows.ps1
  mode: windows-native
  backend_url: http://127.0.0.1:8092
  frontend_url: http://127.0.0.1:3005
  postgres: 127.0.0.1:5434
  redis: 127.0.0.1:6380
  backup_root: "${MY_DOCUMENTS}/Backups/VillaLuz"

architecture:
  backend: Flask + Flask-RESTX + SQLAlchemy + Celery
  frontend: React + TypeScript + Vite + Feature-Sliced Design
  backend_flow: Request -> Namespace -> Service -> Model/Repository -> DB
  frontend_flow: pages -> widgets -> features -> entities -> shared

ai_workflow:
  first_read:
    - .devbrain/context/project-context.yml
    - README.md
    - relevant package/module README
  validate:
    - npm run hygiene
    - npm run modularity:changed
    - npm --prefix frontend run type-check
  never_index:
    - _archive/
    - node_modules/
    - backend/venv*/
    - backend/.venv/
    - logs/
    - frontend/coverage/
    - test-results/
    - playwright-report/
    - runtime databases and logs

policies:
  - Keep one backend and one frontend root.
  - Put backups outside the repository.
  - Keep generated output ignored and out of AI context.
  - Prefer small modular files; document justified legacy exceptions.
  - Do not commit secrets, local databases, logs, or virtual environments.
