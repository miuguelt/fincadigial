services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=${PORT:-34119}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL:?Define DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-}
    expose:
      - "34119"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:34119/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
