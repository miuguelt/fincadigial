  redis:
    image: redis:7-alpine
    container_name: villaluz_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-villaluz_redis_pass}
    networks:
      - villaluz-network
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-villaluz_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

