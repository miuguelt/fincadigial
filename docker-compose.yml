services:
  villaluz-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_RUNTIME_ENV=production
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3101/api/v1}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-http://localhost:3100}
    image: villaluz-frontend:latest
    container_name: villaluz_frontend
    ports:
      - "3003:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - villaluz-backend
    networks:
      - villaluz-network

  villaluz-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: villaluz-backend:latest
    container_name: villaluz_backend
    command: gunicorn --preload --worker-class gevent --workers 4 --worker-connections 1000 --timeout 120 --bind 0.0.0.0:8081 wsgi:app
    ports:
      - "8093:8081"
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=postgresql+psycopg2
      - DB_HOST=villaluz_postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-villaluz}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-finca_db}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_COOKIE_DOMAIN=localhost
      - JWT_COOKIE_SECURE=false
      - JWT_COOKIE_SAMESITE=Lax
      - CORS_ORIGINS=http://localhost:3003,http://127.0.0.1:3003,https://localhost:3003,https://127.0.0.1:3003,http://localhost:3005,http://127.0.0.1:3005,https://localhost:3005,https://127.0.0.1:3005,http://localhost:3000
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - API_BASE_URL_NO_VERSION=http://localhost:8093
      - BACKEND_URL=http://localhost:8093
    networks:
      - villaluz-network
    volumes:
      - ./backend:/app
      - ./maintenance:/app/maintenance
      - ./docs:/app/docs
    depends_on:
      - redis

  villaluz-celery-worker:
    image: villaluz-backend:latest
    container_name: villaluz_celery_worker
    command: celery -A celery_worker.celery worker --loglevel=info
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=postgresql+psycopg2
      - DB_HOST=villaluz_postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-villaluz}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-finca_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    networks:
      - villaluz-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker.celery inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  villaluz-celery-beat:
    image: villaluz-backend:latest
    container_name: villaluz_celery_beat
    command: celery -A celery_worker.celery beat --loglevel=info
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=postgresql+psycopg2
      - DB_HOST=villaluz_postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-villaluz}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-finca_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    networks:
      - villaluz-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'beat' /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

