name: Villa Luz Test Suite
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: |
          cd backend
          pytest tests/unit/ tests/integration/ tests/contract/ \
            --cov=app --cov-report=xml --cov-fail-under=70
        env:
          FLASK_ENV: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          FLASK_SECRET_KEY: test_secret_32_chars_minimum_ok
          JWT_SECRET_KEY: test_jwt_secret_32_chars_minimum
          DB_ENGINE: sqlite
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
      - uses: codecov/codecov-action@v4
        with: { files: ./backend/coverage.xml, flags: backend }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        with: { files: ./coverage/lcov.info, flags: frontend }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: |
          cd backend && flask run --port 5000 &
          npm run dev &
          sleep 5
          npx playwright test
        env:
          FLASK_APP: run.py
          FLASK_ENV: testing
          FLASK_CONFIG: testing
          DATABASE_URL: sqlite:///test.db
          TEST_SQLALCHEMY_DATABASE_URI: sqlite:///test.db
          FLASK_SECRET_KEY: test_secret_32_chars_minimum_ok
          JWT_SECRET_KEY: test_jwt_secret_32_chars_minimum
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
