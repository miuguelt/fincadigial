name: Villa Luz Test Suite
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Generate ephemeral backend test secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"FLASK_SECRET_KEY={secrets.token_hex(32)}\n")
              env_file.write(f"JWT_SECRET_KEY={secrets.token_hex(32)}\n")
          PY
      - run: |
          cd backend
          pytest tests/unit/ tests/integration/ tests/contract/ \
            --cov=app --cov-report=xml --cov-fail-under=70
        env:
          FLASK_ENV: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          DB_ENGINE: sqlite
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
      - uses: codecov/codecov-action@v4
        with: { files: ./backend/coverage.xml, flags: backend }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        with: { files: ./coverage/lcov.info, flags: frontend }

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Generate ephemeral E2E credentials
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"FLASK_SECRET_KEY={secrets.token_hex(32)}\n")
              env_file.write(f"JWT_SECRET_KEY={secrets.token_hex(32)}\n")
              env_file.write(f"E2E_JWT_SECRET={secrets.token_hex(32)}\n")
              env_file.write(f"VILLALUZ_E2E_ADMIN_PASSWORD={secrets.token_hex(24)}\n")
              env_file.write(f"VILLALUZ_E2E_WORKER_PASSWORD={secrets.token_hex(24)}\n")
          PY
      - run: |
          cd backend && flask run --port 5000 &
          npm run dev &
          sleep 5
          npx playwright test
        env:
          FLASK_APP: run.py
          FLASK_ENV: testing
          FLASK_CONFIG: testing
          DATABASE_URL: sqlite:///test.db
          TEST_SQLALCHEMY_DATABASE_URI: sqlite:///test.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
