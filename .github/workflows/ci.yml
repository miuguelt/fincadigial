name: CI — Finca Villa Luz

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend: Dependencias + Tests + Migraciones ───────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"FLASK_SECRET_KEY={secrets.token_hex(32)}\n")
              env_file.write(f"JWT_SECRET_KEY={secrets.token_hex(32)}\n")
          PY

      - name: Run test suite (pytest)
        env:
          FLASK_ENV: testing
          FLASK_CONFIG: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          TEST_SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          DB_ENGINE: sqlite
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
        run: python -m pytest tests/ -v --tb=short --ignore=tests/manual

      - name: Verify versioned migration process
        env:
          FLASK_ENV: testing
          FLASK_CONFIG: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          TEST_SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          DB_ENGINE: sqlite
          REDIS_URL: ""
          CELERY_BROKER_URL: ""
        run: >-
          python -m pytest tests/test_database_migration_process.py
          tests/test_migration_replay.py -q

  # ── Frontend: Type Check + Tests Vitest + Build ───────────────────────
  frontend:
    name: Frontend (TypeScript & React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type-check
        run: npm run type-check

      - name: Run unit and integration tests (Vitest)
        run: npm run test:run

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_FRONTEND_URL: https://example.com
          VITE_RUNTIME_ENV: production
        run: npm run build

  # ── Deploy Check: Pre-deploy & Docker Compose SSoT ────────────────────
  deploy-check:
    name: Deploy Readiness & Compose SSoT
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run deploy check (33/33 checks)
        run: python scripts/deploy_check.py

      - name: Validate Docker Compose SSoT syntax
        run: |
          docker compose -f docker-compose.yaml config --quiet && \
          echo "✅ docker-compose.yaml es válido y cumple SSoT Coolify"
