name: Colombia legal compliance

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-release-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute legal compliance gate
        shell: pwsh
        run: ./scripts/Test-ColombiaLegalCompliance.ps1 -Mode Release

      - name: Execute DevBrain legal lifecycle gate
        shell: pwsh
        run: ./scripts/Test-DevBrainLegalLifecycle.ps1 -Mode Release
