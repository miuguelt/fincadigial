version: '3.8'

# Entorno de staging — réplica de producción con datos de seed
# Uso:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml exec villaluz-backend-stg flask --app wsgi db upgrade
#   docker compose -f docker-compose.staging.yml exec villaluz-backend-stg python seed_data.py

services:
  villaluz-frontend-stg:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_RUNTIME_ENV=staging
        - VITE_API_BASE_URL=${STG_API_BASE_URL:-http://localhost:28081/api/v1}
        - VITE_FRONTEND_URL=${STG_FRONTEND_URL:-http://localhost:23000}
    image: villaluz-frontend:staging
    container_name: villaluz_frontend_stg
    ports:
      - "23000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
    depends_on:
      - villaluz-backend-stg
    networks:
      - villaluz-staging

  villaluz-backend-stg:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: villaluz-backend:staging
    container_name: villaluz_backend_stg
    command: gunicorn --bind 0.0.0.0:8081 wsgi:app --workers ${STG_GUNICORN_WORKERS:-2} --timeout 120
    ports:
      - "28081:8081"
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=mysql+pymysql
      - DB_HOST=db-stg
      - DB_PORT=3306
      - DB_USER=${STG_DB_USER}
      - DB_PASSWORD=${STG_DB_PASSWORD}
      - DB_NAME=${STG_DB_NAME:-finca_staging}
      - FLASK_SECRET_KEY=${STG_FLASK_SECRET_KEY}
      - JWT_SECRET_KEY=${STG_JWT_SECRET_KEY}
      - JWT_COOKIE_DOMAIN=${STG_JWT_COOKIE_DOMAIN:-localhost}
      - REDIS_URL=redis://redis-stg:6379/0
      - CELERY_BROKER_URL=redis://redis-stg:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-stg:6379/0
      - CORS_ORIGINS=${STG_CORS_ORIGINS:-http://localhost:23000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=0.1
      - APP_VERSION=${APP_VERSION:-staging}
      - LOG_LEVEL=DEBUG
    networks:
      - villaluz-staging
    depends_on:
      - db-stg
      - redis-stg

  villaluz-celery-stg:
    image: villaluz-backend:staging
    container_name: villaluz_celery_stg
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_ENGINE=mysql+pymysql
      - DB_HOST=db-stg
      - DB_PORT=3306
      - DB_USER=${STG_DB_USER}
      - DB_PASSWORD=${STG_DB_PASSWORD}
      - DB_NAME=${STG_DB_NAME:-finca_staging}
      - JWT_SECRET_KEY=${STG_JWT_SECRET_KEY}
      - REDIS_URL=redis://redis-stg:6379/0
      - CELERY_BROKER_URL=redis://redis-stg:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-stg:6379/0
    networks:
      - villaluz-staging
    depends_on:
      - db-stg
      - redis-stg

  db-stg:
    image: mariadb:10.11
    container_name: villaluz_db_stg
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${STG_DB_NAME:-finca_staging}
      - MYSQL_USER=${STG_DB_USER}
      - MYSQL_PASSWORD=${STG_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${STG_MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    networks:
      - villaluz-staging
    volumes:
      - mysql_staging:/var/lib/mysql

  redis-stg:
    image: redis:7-alpine
    container_name: villaluz_redis_stg
    restart: unless-stopped
    networks:
      - villaluz-staging
    volumes:
      - redis_staging:/data

networks:
  villaluz-staging:
    driver: bridge

volumes:
  mysql_staging:
  redis_staging:
