name: villaluz

# Perfil de despliegue para Coolify.
# La base de datos y Redis deben ser recursos privados gestionados por Coolify
# o por el proveedor aprobado por SENA. No se publican puertos de infraestructura.
services:
  villaluz-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      TZ: America/Bogota
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_COOKIE_SECURE: "true"
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      JWT_COOKIE_CSRF_PROTECT: "true"
      AUTH_COOKIE_ONLY: "true"
      DATA_COLLECTION_ENABLED: ${DATA_COLLECTION_ENABLED:-false}
      PUBLIC_USER_CREATION_ENABLED: ${PUBLIC_USER_CREATION_ENABLED:-false}
      PRIVATE_FILE_URL_MAX_AGE_SECONDS: ${PRIVATE_FILE_URL_MAX_AGE_SECONDS:-300}
      SENA_INSTITUTIONAL_MODE: ${SENA_INSTITUTIONAL_MODE:-provisional_not_authorized}
      LEGAL_RELEASE_APPROVED: ${LEGAL_RELEASE_APPROVED:-false}
    expose:
      - "8081"
    volumes:
      - villaluz_uploads:/app/static/uploads
    networks:
      - villaluz_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  villaluz-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RUNTIME_ENV: production
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
        VITE_USE_BEARER_AUTH: "false"
    restart: unless-stopped
    depends_on:
      villaluz-backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - villaluz_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  villaluz_uploads:
    name: villaluz_uploads

networks:
  villaluz_internal:
    name: villaluz_internal
    driver: bridge
