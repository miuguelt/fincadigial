[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "finca-villa-luz"
version = "1.0.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
    "PL",   # pylint
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in argument defaults (Flask patterns)
    "N803",  # argument name should be lowercase (SQLAlchemy patterns)
    "N806",  # variable in function should be lowercase
    "UP007", # Use X | Y for union types — requires Python 3.10+
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # unused imports OK in __init__
"tests/*" = ["B", "SIM"]   # relax in tests
"scripts/*" = ["B", "SIM"] # relax in scripts
"migrations/*" = ["E", "F", "B", "SIM", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pylint]
max-line-length = 100
max-module-lines = 200
max-args = 5
max-locals = 15
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 50
show_missing = true
